<html lang="en">
<head>

<body>
<div id="login" class="login" hidden>
  <div class="aurora" aria-hidden="true"></div>
  <form id="loginForm" class="card login-card" novalidate></form>
  <p class="login-foot">Edge · private trading co-pilot</p>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="26" height="26"><span>Edge</span></div>
    <div class="row" style="gap:8px"><button type="button" id="themeBtn" class="themebtn" aria-label="Light or dark"></button><button type="button" id="helpBtn" class="helpbtn" aria-label="What am I looking at?">?</button><div id="topStatus" class="pill"></div></div>
  </header>
  <div class="shell" id="shell"><section id="home" class="home" hidden></section>
  <main id="view"></main></div>
  <main id="coach" hidden></main>
  <nav class="tabs" id="tabs">
    <button data-tab="now" class="on"><svg viewBox="0 0 24 24"><path d="M4 19V9M9 19V5M14 19v-7M19 19V8"/><path d="M3 19h18"/></svg>Home<i id="setupBadge" hidden></i></button>
    <button data-tab="coach"><svg viewBox="0 0 24 24"><path d="M2 8l10-5 10 5-10 5L2 8z"/><path d="M6 10v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>Coach</button>
    <button data-tab="journal"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M9 9h6M9 13h6"/></svg>Journal</button>
    <button data-tab="rules"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </nav>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1d79f"/><stop offset=".5" stop-color="#d9b46c"/><stop offset="1" stop-color="#ad7f37"/></linearGradient></defs></svg>
