<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Edge</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Edge">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="login" class="login" hidden>
  <div class="aurora" aria-hidden="true"></div>
  <form id="loginForm" class="card login-card" novalidate></form>
  <p class="login-foot">Edge · private trading co-pilot</p>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="26" height="26"><span>Edge</span></div>
    <div id="topStatus" class="pill"></div>
  </header>
  <main id="view"></main>
  <main id="coach" hidden></main>
  <nav class="tabs" id="tabs">
    <button data-tab="now" class="on"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Now</button>
    <button data-tab="coach"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Coach</button>
    <button data-tab="setups"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>Setups<i id="setupBadge" hidden></i></button>
    <button data-tab="bias"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0L5 7zm14 0-3 7a3 3 0 0 0 6 0l-3-7zM8 21h8"/></svg>Bias</button>
    <button data-tab="journal"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M9 9h6M9 13h6"/></svg>Journal</button>
    <button data-tab="rules"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Rules</button>
  </nav>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1d79f"/><stop offset=".5" stop-color="#d9b46c"/><stop offset="1" stop-color="#ad7f37"/></linearGradient></defs></svg>
<dialog id="modal"><form method="dialog" id="modalBody" class="modal"></form></dialog>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
<script src="coach.js"></script>
</body>
</html>
