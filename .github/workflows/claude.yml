# Claude Code works on Edge when an issue or comment mentions @claude.
# David (the voice assistant) opens those issues when Steve asks him to change Edge.
# Claude Code works on its own branch and never pushes to main: the change goes live only when
# Steve opens and merges the pull request. Needs the repo secret ANTHROPIC_API_KEY.
# Only people with write access to the repo can trigger it.
name: Claude Code

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Bash(npm test),Bash(npm ci),Bash(node --test:*)"
            --append-system-prompt "This is Edge, Steve's trading app. Follow the skills in .claude/skills (the supply-demand skill is his strategy). Run npm test before you finish; never weaken or skip a test, and never change his risk limits, prop-firm safety rules (flat times, news blocks, daily loss, inactivity) or the broker code unless the request asks for exactly that. Explain the change in plain, short sentences for someone who doesn't code."
