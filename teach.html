<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0c1a">
<title>Teach Edge</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
<style>
  /* the page itself: the same night look as the Teach Edge screen */
  html, body { margin: 0; min-height: 100%; background: #0b0c1a; color: #f3f4ff; font-family: var(--font); }
  .tp-wrap { max-width: 520px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 18px 40px; }
  .tp-wrap h1 { font-family: var(--display); font-size: 30px; margin: 10px 0 6px; background: linear-gradient(90deg, #ffd36e, #ff7ab6 55%, #c77dff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tp-wrap p { color: #a9b0dc; line-height: 1.5; }
  .tp-card { margin-top: 18px; padding: 18px; border-radius: 18px; background: linear-gradient(135deg, rgba(124, 92, 255, .18), rgba(0, 212, 255, .08) 60%, rgba(46, 242, 166, .10)), #10122a; border: 1px solid rgba(140, 150, 255, .3); }
  .tp-card label { display: block; font-size: 13px; font-weight: 700; color: #dfe2ff; margin: 10px 0 6px; }
  .tp-card input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .14); background: rgba(255, 255, 255, .06); color: #fff; font: 500 15px var(--font); }
  .tp-card .btn { margin-top: 14px; width: 100%; background: linear-gradient(135deg, #7c5cff, #00d4ff); color: #fff; border: 0; }
  .tp-err { color: #ff4d7d; min-height: 1.2em; font-weight: 600; }
  .tp-steps { display: grid; gap: 8px; margin-top: 14px; }
  .tp-steps div { padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .05); border-left: 4px solid var(--c); font-size: 14px; }
  .teach-card { background: linear-gradient(135deg, rgba(124, 92, 255, .18), rgba(0, 212, 255, .08) 60%, rgba(46, 242, 166, .10)), #10122a !important; color: #f3f4ff; border: 1px solid rgba(140, 150, 255, .3); border-radius: 18px; padding: 16px; }
  .teach-card .muted { color: #a9b0dc !important; } .teach-card h2 { color: #fff; margin: 0 0 8px; font-size: 16px; }
  @media (min-width: 900px) { .teach-ov { padding-left: max(14px, calc(50vw - 460px)); padding-right: max(14px, calc(50vw - 460px)); } .tc-cv { height: min(62vh, 640px); } }
</style>
</head>
<body>
<div class="tp-wrap" id="page"></div>
<script src="/teach.js"></script>
<script>
(function () {
  const page = document.getElementById("page");
  const tok = () => { try { return localStorage.getItem("edge.token") || ""; } catch { return ""; } };
  const intro = `<h1>Teach Edge</h1><p>Real past charts from your 9 markets, one after another. Show Claude how <b>you</b> trade them — 20 to 30 is the goal.</p>
    <div class="tp-steps"><div style="--c:#2ef2a6"><b>1 · Zone</b> — tap the top and bottom of the zone you'd trade, tap why, add a note.</div>
    <div style="--c:#5cc8ff"><b>2 · Watch</b> — play that day's 5m from 03:00 New York. No peeking ahead.</div>
    <div style="--c:#ffb020"><b>3 · Trade</b> — 📍 Trade here, then tap entry, stop, target. Or "No trade today".</div>
    <div style="--c:#c77dff"><b>4 · Result</b> — see what happened, add a note, next chart.</div></div>`;
  function signIn(msg) {
    page.innerHTML = `${intro}<form class="tp-card" id="f"><b>Sign in with your Edge account</b>
      <label for="e">Email</label><input id="e" type="email" autocomplete="username" required>
      <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
      <p class="tp-err" id="err">${msg || ""}</p><button class="btn" type="submit">Sign in and start</button>
      <p style="font-size:13px;margin:14px 0 0">Don't know your login? Open the <b>Edge app</b> (you're signed in there) → <b>Test</b> → <b>Teach Edge</b> → <b>Full page ↗</b>. Forgot your password? Edge's sign-in screen → <b>Forgot password?</b> uses the recovery code you saved when you made the account.</p></form>`;
    document.getElementById("f").addEventListener("submit", async (ev) => {
      ev.preventDefault(); const err = document.getElementById("err"); err.textContent = "";
      try {
        const r = await fetch("/api/app", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "login", email: document.getElementById("e").value, password: document.getElementById("p").value }) });
        const j = await r.json().catch(() => ({})); if (!r.ok || !j.token) throw new Error(j.error || "Couldn't sign in.");
        try { localStorage.setItem("edge.token", j.token); if (j.email) localStorage.setItem("edge.email", j.email); } catch {}
        start();
      } catch (x) { err.textContent = x.message; }
    });
  }
  async function start() {
    const r = await fetch("/api/candles?teach=1&label=1", { headers: { Authorization: `Bearer ${tok()}` } }).catch(() => null);
    if (!r || r.status === 401) return signIn(r ? "" : "No connection — try again.");
    page.innerHTML = `${intro}<div id="host" style="margin-top:18px"></div><p style="text-align:center;margin-top:18px"><a href="/" style="color:#a9b0dc">← Back to Edge</a></p>`;
    window.EdgeTeach.mount(document.getElementById("host")); window.EdgeTeach.open();
  }
  start();
})();
</script>
</body>
</html>
